version: "3"

vars:
  RACE_FLAGS: "-race"
  INTEGRATION_FLAGS: "{{.RACE_FLAGS}} -count=2"

tasks:
  default:
    desc: Run all CI jobs (lint, unit, generate, integration)
    cmds:
      - task: lint
      - task: unit
      - task: generate
      - task: integration

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run --verbose

  unit:
    desc: Run unit tests with race detector
    cmds:
      - go test {{.RACE_FLAGS}} ./...
      - go -C cmd test {{.RACE_FLAGS}} ./...
      - go -C dialect test {{.RACE_FLAGS}} ./...
      - go -C schema test {{.RACE_FLAGS}} ./...
      - go -C entc/load test {{.RACE_FLAGS}} ./...
      - go -C entc/gen test {{.RACE_FLAGS}} ./...
      - go -C examples test {{.RACE_FLAGS}} ./...

  generate:
    desc: Run go generate
    cmds:
      - go generate ./... && go mod tidy
      - go -C examples generate ./... && go -C examples mod tidy
      - go -C entc/integration generate ./... && go -C entc/integration mod tidy

  integration:
    desc: Run integration tests against DB services
    cmds:
      - go -C entc/integration test {{.INTEGRATION_FLAGS}} ./...

  db:up:
    desc: Start database services from entc/integration/docker-compose.yaml
    cmds:
      - docker compose -f entc/integration/docker-compose.yaml up -d --wait

  db:down:
    desc: Stop database services
    cmds:
      - docker compose -f entc/integration/docker-compose.yaml down

  db:logs:
    desc: Tail database service logs
    cmds:
      - docker compose -f entc/integration/docker-compose.yaml logs -f
