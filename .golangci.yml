version: "2"
run:
  go: "1.27"
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - dogsled
    - dupl
    - errcheck
    - funlen
    - gocritic
    - goheader
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    dupl:
      threshold: 100
    errcheck:
      exclude-functions:
        - fmt:.*,Read|Write|Close|Exec
        - io:Copy
    funlen:
      lines: 200
      statements: 200
    goheader:
      template: |-
        Copyright 2019-present Facebook Inc. All rights reserved.
        This source code is licensed under the Apache 2.0 license found
        in the LICENSE file in the root directory of this source tree.
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - funlen
          - gocritic
          - gosec
        path: _test\.go
      - linters:
          - unused
        source: ent.Schema
      - linters:
          - dupl
          - gosec
        path: dialect/sql/schema
      - linters:
          - gosec
        text: Expect WriteFile permissions to be 0600 or less
      - linters:
          - staticcheck
        path: privacy/privacy.go
      - linters:
          - staticcheck
        path: entc/load/schema.go
      - linters:
          - gocritic
        path: entc/gen/graph.go
      - linters:
          - staticcheck
        path: \.go
        text: SA1019
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
